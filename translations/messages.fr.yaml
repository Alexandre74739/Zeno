faq:
    heading: 'Des questions ? On a les réponses.'
    description: "Tout ce qu'il faut savoir avant de rejoindre Zeno et de faire grandir ton compagnon jour après jour."
    item1_question: 'Est-ce que Zeno est vraiment gratuit ?'
    item1_answer: "Oui, 100% gratuit et sans carte bancaire. Une nouvelle question t'attend chaque jour, sans limite."
