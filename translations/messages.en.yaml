privacy_policy:
    title: 'Privacy Policy'
    meta_title: 'Privacy Policy | Zeno'
    intro: 'This policy explains what data Zeno collects when you create an account and use the game, why, and how to exercise your rights under the General Data Protection Regulation (GDPR).'
    controller_heading: 'Data controller'
    controller_body: 'The data controller is [company name to be completed], reachable at [contact email].'
    data_heading: 'Data collected'
    data_body: 'When you create an account, we collect your last name, first name, email address, phone number, and password (stored encrypted, never in plain text). We also keep your game progress (answers given, streaks, your virtual companion’s growth).'
    purpose_heading: 'Purposes of processing'
    purpose_body: 'This data is used to create and secure your account, let you play and save your progress, and contact you about your account when needed.'
    legal_basis_heading: 'Legal basis'
    legal_basis_body: 'Processing is based on the performance of the contract formed when you create an account (providing the game service), and on our legitimate interest in keeping the service secure.'
    retention_heading: 'Retention period'
    retention_body: 'Your data is kept for as long as your account is active. If your account is inactive for a long period or deleted, your data is erased or anonymized within a reasonable timeframe.'
    recipients_heading: 'Data recipients'
    recipients_body: 'Your data is never sold or shared for commercial purposes. It may be shared with our technical providers (hosting, email delivery) strictly as needed to run the service.'
    rights_heading: 'Your rights'
    rights_body: 'Under the GDPR, you have the right to access, rectify, erase, restrict, object to, and port your data. You can exercise these rights by contacting us at [contact email]. You also have the right to lodge a complaint with your national data protection authority (in France, the CNIL — www.cnil.fr).'
    security_heading: 'Security'
    security_body: 'We implement reasonable technical and organizational measures to protect your data against unauthorized access, loss, or alteration.'
    changes_heading: 'Changes'
    changes_body: 'This policy may be updated from time to time. The last update date is shown at the top of this page.'

