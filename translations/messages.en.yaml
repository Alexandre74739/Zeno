cookie_policy:
    title: 'Cookie Policy'
    meta_title: 'Cookie Policy | Zeno'
    intro: 'This page explains what a cookie is and which cookies are used on Zeno.'
    what_heading: 'What is a cookie?'
    what_body: 'A cookie is a small text file placed on your device while browsing, which helps recognize you from one page or visit to the next.'
    used_heading: 'Cookies used on Zeno'
    used_body: 'Today, Zeno only uses cookies that are strictly necessary for the service to work: the session cookie that keeps you signed in to your account during your visit. This cookie does not require your consent because it is essential to providing the service you requested.'
    no_tracking_heading: 'No analytics or advertising cookies'
    no_tracking_body: 'Zeno currently uses no audience-measurement, advertising, or social-media cookies. If that changes, a consent banner letting you accept or reject those cookies will be shown before any are set.'
    manage_heading: 'Managing cookies'
    manage_body: 'You can configure your browser at any time to reject cookies. Since the session cookie is strictly necessary, rejecting it will prevent you from staying signed in to your account.'
    contact_heading: 'Contact'
    contact_body: 'For any question about this policy, contact us at [contact email].'
