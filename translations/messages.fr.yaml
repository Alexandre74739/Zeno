    item2_answer: "Quelques secondes ! Une seule question par jour, à ton rythme, sans pression ni chronomètre."
    item3_question: 'Que se passe-t-il si je rate un jour ?'
    item3_answer: 'Ta série est interrompue et ton chat fait la tête, mais tu peux reprendre dès le lendemain pour en recommencer une nouvelle.'
    item4_question: "Ai-je besoin d'un compte pour jouer ?"
    item4_answer: "Un compte te permet de sauvegarder ta progression et de garder ton compagnon d'une visite à l'autre."
    item5_question: "Sur quels thèmes portent les questions ?"
    item5_answer: 'Histoire, sciences, culture pop, géographie et bien plus : les thèmes varient chaque jour pour élargir ta culture générale.'

